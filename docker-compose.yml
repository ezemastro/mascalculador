services:
  viga-continua:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: concrete
        BUILD_CMD: build:viga-continua
        DIST: dist-viga-continua
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  hormigon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: concrete
        BUILD_CMD: build
        DIST: dist
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  acero:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: steel
        BUILD_CMD: build
        DIST: dist
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
